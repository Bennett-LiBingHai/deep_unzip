distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 走腾讯云镜像。官方 services.gradle.org 在国内直连不稳（本仓库首次构建即卡在
# 下载发行包上），镜像同时供国内 CI。用 -bin 而非 -all：只少 sources/javadoc，
# 构建行为完全一致，体积小得多。
#
# 与主 app 的 android/gradle/wrapper/gradle-wrapper.properties **保持逐字一致**：
# 版本号相同 → 镜像 URL 相同 → Gradle 按 URL 哈希复用 ~/.gradle/wrapper/dists
# 里已下好的那一份，这里一个字节都不用重新下。URL 一旦不同就会各下一份，
# 白等几分钟还占几百 MB。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
