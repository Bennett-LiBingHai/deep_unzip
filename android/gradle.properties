org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关掉 Kotlin 增量编译。Kotlin 的编译 daemon 会跨构建复用，其 FilePageCache
# 静态注册表未清理，同一路径二次注册即抛 "Storage ... is already registered"，
# 进而以 "Could not close incremental caches" 让整段构建失败
# （Kotlin 2.4.0 + AGP 9.1 + Windows 上稳定复现，与磁盘、杀软、文件锁无关）。
# 本项目自身的 Kotlin 代码几乎为零（只有插件的），关掉增量只是让插件模块全量重编，
# 换来构建可重复。若将来 Kotlin 代码变多，可改为
# kotlin.compiler.execution.strategy=in-process 并重新验证。
kotlin.incremental=false
